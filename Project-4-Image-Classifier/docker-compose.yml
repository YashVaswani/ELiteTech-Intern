services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - APP_CORS_ORIGINS=["http://localhost:5173"]
    volumes:
      - ./backend/models:/app/models:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
